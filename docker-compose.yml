version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: gradelens_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: gradelens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gradelens_redis
    restart: always
    ports:
      - "6379:6379"

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: gradelens_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gradelens_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/gradelens?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=gradelens_jwt_secret_key_change_in_production_2026
      - JWT_REFRESH_SECRET=gradelens_refresh_secret_key_2026
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gradelens_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  n8n_data:
